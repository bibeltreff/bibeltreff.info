<!doctype html>
<html lang="{{lang}}" data-root="{{root}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d61b2">
  <script>
    try {
      const theme = sessionStorage.getItem('bibeltreff-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* The system theme also works when storage is unavailable. */ }
  </script>
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
{{meta}}
  <link rel="icon" href="assets/images/favicon-tree-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/images/favicon-tree-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon-tree.png" sizes="180x180">
  <link rel="preload" href="assets/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
{{scripts}}
</head>
<body>
  <a class="skip-link" href="#inhalt">{{skip}}</a>
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M12 5v14m-6-6 6 6 6-6"/></symbol>
    <symbol id="icon-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-dark" viewBox="0 0 24 24"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></symbol>
  </defs></svg>

  <header class="site-header">
    <div class="header-inner wrap">
      <a class="brand" href="{{homeUrl}}" aria-label="{{home}}"><span class="brand-icon"><img class="brand-mark" src="assets/images/bibeltreff-tree.png" alt="" width="34" height="34" decoding="async"></span>Bibeltreff</a>
      <nav class="main-nav" id="main-nav" aria-label="{{navigation}}">{{nav}}</nav>
      <div class="header-actions">
        <button type="button" class="theme-toggle" data-label="{{theme}}" data-light="{{light}}" data-dark="{{dark}}" data-switch-light="{{switchLight}}" data-switch-dark="{{switchDark}}" aria-label="{{theme}}" hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-light"/></svg>
        </button>
        <a class="language-switch" href="{{languageUrl}}" lang="{{otherLang}}" hreflang="{{otherLang}}" aria-label="{{languageLabel}}">{{languageName}}</a>
        <button type="button" class="nav-toggle" aria-controls="main-nav" aria-expanded="false" data-open="{{menuOpen}}" data-close="{{menuClose}}" aria-label="{{menuOpen}}" hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-menu"/></svg>
        </button>
      </div>
    </div>
  </header>

{{main}}
  <footer class="site-footer wrap"><div class="footer-main"><a class="brand" href="{{homeUrl}}"><span class="brand-icon"><img class="brand-mark" src="assets/images/bibeltreff-tree.png" alt="" width="34" height="34" decoding="async"></span>Bibeltreff</a><p>{{footer}}</p><div class="footer-links"><nav class="social-links" aria-label="{{channels}}">{{social}}</nav>{{legal}}</div></div></footer>
</body>
</html>
